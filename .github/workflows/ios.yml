# Tests only. Builds (signed store releases and the unsigned sideload IPA) run on Codemagic: see codemagic.yaml.
name: Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rules tests
        working-directory: packages/rules
        run: dart test
      - name: App tests
        working-directory: app
        run: flutter test
